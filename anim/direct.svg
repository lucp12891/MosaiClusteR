<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-label="Two source blocks slide together into one, then are clustered.">
  <g fill="#2E7E8C">
    <animateTransform attributeName="transform" type="translate" values="-110,0;0,0;0,0;-110,0" keyTimes="0;0.35;0.75;1" dur="5s" repeatCount="indefinite"/>
    <rect x="150" y="26" width="26" height="26" rx="4"/><rect x="182" y="26" width="26" height="26" rx="4"/>
    <rect x="150" y="58" width="26" height="26" rx="4"/><rect x="182" y="58" width="26" height="26" rx="4"/>
    <rect x="150" y="90" width="26" height="26" rx="4"/><rect x="182" y="90" width="26" height="26" rx="4"/>
  </g>
  <g fill="#D39A4E">
    <animateTransform attributeName="transform" type="translate" values="110,0;0,0;0,0;110,0" keyTimes="0;0.35;0.75;1" dur="5s" repeatCount="indefinite"/>
    <rect x="214" y="26" width="26" height="26" rx="4"/><rect x="246" y="26" width="26" height="26" rx="4"/>
    <rect x="214" y="58" width="26" height="26" rx="4"/><rect x="246" y="58" width="26" height="26" rx="4"/>
    <rect x="214" y="90" width="26" height="26" rx="4"/><rect x="246" y="90" width="26" height="26" rx="4"/>
  </g>
  <rect x="140" y="18" width="142" height="106" rx="8" fill="none" stroke="#15293D" stroke-width="3">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.75;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
