<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170" role="img" aria-label="Three partitions of the same objects vote, and a consensus partition emerges.">
  <g font-family="sans-serif" font-size="12" fill="#1A2A4F"><text x="20" y="34">vote 1</text><text x="20" y="70">vote 2</text><text x="20" y="106">vote 3</text><text x="14" y="150">consensus</text></g>
  <g>
    <rect x="90" y="22" width="40" height="18" rx="4" fill="#12B886"/><rect x="134" y="22" width="40" height="18" rx="4" fill="#12B886"/><rect x="178" y="22" width="40" height="18" rx="4" fill="#F59F00"/><rect x="222" y="22" width="80" height="18" rx="4" fill="#F59F00"/>
    <rect x="90" y="58" width="84" height="18" rx="4" fill="#12B886"/><rect x="178" y="58" width="40" height="18" rx="4" fill="#F59F00"/><rect x="222" y="58" width="80" height="18" rx="4" fill="#F59F00"/>
    <rect x="90" y="94" width="40" height="18" rx="4" fill="#12B886"/><rect x="134" y="94" width="84" height="18" rx="4" fill="#12B886"/><rect x="222" y="94" width="80" height="18" rx="4" fill="#F59F00"/>
